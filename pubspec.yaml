name: cloudshell
description: "CloudShell - Cross-platform SSH client with E2E encrypted sync"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # --- SSH & Terminal ---
  dartssh2: ^2.9.0
  xterm: ^4.0.0

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Database ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # --- Secure Storage ---
  flutter_secure_storage: ^9.2.4

  # --- Crypto ---
  pointycastle: ^3.9.1
  cryptography: ^2.7.0
  uuid: ^4.5.1

  # --- Data Models ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Networking ---
  dio: ^5.7.0

  # --- Navigation ---
  go_router: ^14.8.1

  # --- UI ---
  lucide_icons: ^0.257.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # --- Biometrics ---
  local_auth: ^2.3.0

  # --- File Handling ---
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # --- Utilities ---
  intl: ^0.20.2
  logger: ^2.5.0
  connectivity_plus: ^6.1.4
  collection: ^1.19.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code Generation ---
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.1

  # --- Linting ---
  flutter_lints: ^6.0.0

  # --- Testing ---
  mockito: ^5.4.6
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/terminal_themes/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
          style: italic
