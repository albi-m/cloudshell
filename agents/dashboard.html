Object.entries(SC).forEach(([k,cfg])=>{const col=fl.filter(t=>t.s===k);
h+=`<div class="col"><div class="ch"><div class="cd" style="background:${cfg.c}"></div><span class="ct" style="color:${cfg.c}">${cfg.l}</span><span class="cc">${col.length}</span></div>`;
col.forEach(t=>{h+=`<div class="task" onclick="cycle('${t.ai}','${t.id}')"><div class="tt"><span class="ti">${t.id}</span><span class="tp" style="background:${PC[t.p]}18;color:${PC[t.p]}">${t.p}</span></div><div class="td">${t.ds}</div><div class="ttl">${t.tl}</div><div class="tb"><span class="ta" style="color:${t.ac}">${t.aic} ${t.an}</span><span class="te">${t.e}</span></div></div>`});
h+=`</div>`});return h+'</div>'}

function rTime(al){
let h='<div class="timeline">';
PH.forEach(p=>{const tk=al.filter(t=>p.tk.includes(t.id)),dn=tk.filter(t=>t.s==='done').length,ags=A.filter(a=>p.ag.includes(a.id));
const bc=dn===tk.length?'var(--green)':dn>0?'var(--blue)':'var(--border-default)';
h+=`<div class="phase" style="border-left:3px solid ${bc}"><div class="ph"><div><div style="display:flex;align-items:center"><span class="pb">Phase ${p.id}</span><span class="pn">${p.nm}</span></div><div class="pdesc">${p.ds}</div></div><div><div class="pdur">${p.du}</div><div class="ppr">${dn}/${tk.length} tasks</div></div></div>
<div class="pa">${ags.map(a=>`<span class="pat" style="background:${a.c}12;border:1px solid ${a.c}30;color:${a.c}">${a.i} ${a.n}</span>`).join('')}${p.pl?'<span class="pll">⚡ Parallel</span>':''}</div>
<div class="pts">${tk.map(t=>`<span class="ptc" style="background:${SC[t.s].b};color:${SC[t.s].c};border:1px solid ${SC[t.s].c}30" onclick="cycle('${t.ai}','${t.id}')" title="${t.tl}">${t.id}</span>`).join('')}</div></div>`});
return h+'</div>'}function rAgents(){
let h='<div class="ag">';
A.forEach(a=>{const dn=a.t.filter(t=>t.s==='done').length,hrs=a.t.reduce((s,t)=>s+parseFloat(t.e),0),pct=(dn/a.t.length)*100;
h+=`<div class="ac" style="border-top:3px solid ${a.c}"><div class="ah"><div class="ai" style="background:${a.c}18">${a.i}</div><div><div class="an">${a.n}</div><div class="am">${a.d} • ${hrs}h</div></div><span class="acnt" style="background:${dn===a.t.length?'#064E3B':'rgba(255,255,255,.04)'};color:${dn===a.t.length?'var(--green)':'var(--text-secondary)'}">${dn}/${a.t.length}</span></div>
<div class="apr"><div class="apf" style="width:${pct}%;background:${a.c}"></div></div>
${a.t.map(t=>`<div class="atk" onclick="cycle('${a.id}','${t.id}')"><div class="atkd" style="background:${PC[t.p]}"></div><span class="atki">${t.id}</span><span class="atkt">${t.tl}</span><span class="atks" style="background:${SC[t.s].b};color:${SC[t.s].c}">${SC[t.s].l}</span></div>`).join('')}
</div>`});return h+'</div>'}

// Load progress from progress.json (auto-sync with agents)
async function loadFromFile(){
try{
const r=await fetch('progress.json');
if(r.ok){const d=await r.json();
if(d.tasks){Object.entries(d.tasks).forEach(([id,info])=>{
A.forEach(a=>a.t.forEach(t=>{if(t.id===id)t.s=info.status}))});
st.ts={...st.ts,...Object.fromEntries(Object.entries(d.tasks).map(([k,v])=>[k,v.status]))};
try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}
}}
}catch(e){/* file not available, use localStorage */}
render()}

// Poll progress.json every 5 seconds for agent updates
setInterval(async()=>{
try{const r=await fetch('progress.json?t='+Date.now());
if(r.ok){const d=await r.json();
if(d.tasks){let changed=false;
Object.entries(d.tasks).forEach(([id,info])=>{
A.forEach(a=>a.t.forEach(t=>{if(t.id===id&&t.s!==info.status){t.s=info.status;changed=true}}))});
if(changed){save();render()}}}}catch(e){}
},5000);

load();loadFromFile();
</script></body></html>
