name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter test

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build macos --release
      - name: Archive macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../cloudshell-macos.zip CloudShell.app
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: cloudshell-macos.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libserialport-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - name: Archive Linux build
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../cloudshell-linux-x64.tar.gz bundle/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: cloudshell-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - name: Archive Windows build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath cloudshell-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: cloudshell-windows-x64.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign
      - name: Archive iOS build
        run: |
          cd build/ios/iphoneos
          zip -r ../../../cloudshell-ios.zip Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: cloudshell-ios.zip

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows, build-android, build-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts/
      - name: Collect artifacts
        run: |
          mkdir -p release-files
          cp release-artifacts/macos-release/cloudshell-macos.zip release-files/
          cp release-artifacts/linux-release/cloudshell-linux-x64.tar.gz release-files/
          cp release-artifacts/windows-release/cloudshell-windows-x64.zip release-files/
          cp release-artifacts/android-release/app-release.apk release-files/cloudshell-android.apk
          cp release-artifacts/ios-release/cloudshell-ios.zip release-files/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
